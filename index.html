<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Good Morning</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1020;
 color:white;
 font-family:Arial,sans-serif
}
header{
 text-align:center;
 padding:25px 10px;
 background:linear-gradient(135deg,#ff512f,#dd2476)
}
header h1{margin:0;font-size:28px}
.date{
 text-align:center;
 padding:18px 5px;

}
.categories{

 padding:10px
}
button{

}
button.active{background:#e83e8c}
.gallery{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
 padding:12px
}
.card{
 background:#1a2138;
 border-radius:14px;
 overflow:hidden
}
.card img{
 width:100%;
 height:230px;
 object-fit:cover;
 display:block
}
.card h3{
 font-size:14px;
 text-align:center;
 padding:0 5px
}
.actions{
 display:flex;
 justify-content:center;
 gap:5px;
 padding:0 5px 12px
}
.actions button{
 font-size:12px;
 padding:10px
}
footer{
 text-align:center;
 padding:25px;
 color:#bbb
}
@media(min-width:700px){
 .gallery{grid-template-columns:repeat(4,minmax(0,1fr))}
 .card img{height:330px}
}
</style>
</head>
