<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>Daily Good Morning 🌞</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0c1020;
 color:white;
}
header{
 text-align:center;
 padding:25px 12px;
 background:linear-gradient(135deg,#6427d5,#ec4899);
}
header h1{margin:0;font-size:27px}
header p{margin-bottom:0}
.date{
 text-align:center;
 padding:15px;
 font-size:18px;
 color:#ffe08a;
}
.categories{
 display:flex;
 gap:8px;
 padding:10px;
 overflow-x:auto;
}
button{
 border:0;
 padding:11px 15px;
 border-radius:22px;
 background:#252c47;
 color:white;
 font-size:14px;
 cursor:pointer;
 white-space:nowrap;
}
button.active{background:#e83e8c}
.container{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
 padding:12px;
}
.card{
 background:#191f35;
 border-radius:14px;
 overflow:hidden;
}
.card img{
 width:100%;
 height:250px;
 object-fit:cover;
 display:block;
}
.card h3{
 text-align:center;
 font-size:14px;
 padding:0 5px;
}
.actions{
 display:flex;
 justify-content:center;
 gap:6px;
 padding:0 5px 12px;
}
.actions button{padding:9px;font-size:12px}
footer{
 text-align:center;
 padding:25px;
 color:#aaa;
}
